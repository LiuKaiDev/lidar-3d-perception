experiment_id: E3
status: PASS
hypothesis: CenterPoint and VoxelNeXt may make complementary errors recoverable by deterministic prediction-only late fusion.
dataset:
  name: nuscenes
  version: v1.0-mini
  split: mini_train
  role: mini_train complementarity/tuning; mini_val frozen confirmation only
models:
  - name: centerpoint_pointpillar
    config: configs/detectors/centerpoint/nuscenes_mini.yaml
    config_sha256: 58b5b8b2e4303a4563b6635c7d9f75a41acc8714635914b4d2cfb95ba8e40fc0
    checkpoint: ~/checkpoints/openpcdet/centerpoint_nuscenes_pp.pth
    checkpoint_sha256: 955a3e38868b81f6ae74f09f84a774ef002d03484c6a8e1194b147069c0a6c2a
    sweeps: 10
  - name: voxelnext
    config: configs/detectors/voxelnext/nuscenes_mini.yaml
    config_sha256: 2e44c2d2c3c533e6f47dfeb5203de29e98232925c17e0c36b2320477785e75f9
    checkpoint: ~/checkpoints/openpcdet/voxelnext_nuscenes.pth
    checkpoint_sha256: 9409dd8c13c8c8ca546c8c5af024856d03029e2def8d5fc0fa3bfe4477e7d88b
    sweeps: 10
prediction_candidate_threshold: 0.1
score_filtering_policy: fixed upstream post-processing and project export floor 0.1
association:
  method: class_aware_center_distance_one_to_one
  threshold_search_m: [0.5, 1.0, 1.5, 2.0]
score_fusion:
  formula: probabilistic_or
  centerpoint_weight_search: [0.8, 1.0, 1.2]
  voxelnext_weight: 1.0
  matched_geometry: winner_take_all_by_adjusted_score
  unmatched_policy: retain_adjusted_score_ge_floor
  max_boxes: 500
naive_union:
  duplicate_threshold_m: 0.01
  optimized: false
matching:
  strategy: center_distance
  class_aware: true
  one_to_one: true
  threshold_m: 2.0
  comparison: distance <= threshold
distance_bins:
  - {name: 0-10m, lower: 0.0, upper: 10.0}
  - {name: 10-20m, lower: 10.0, upper: 20.0}
  - {name: 20-30m, lower: 20.0, upper: 30.0}
  - {name: 30-40m, lower: 30.0, upper: 40.0}
  - {name: 40-50m, lower: 40.0, upper: 50.0}
  - {name: 50m+, lower: 50.0, upper: .inf}
density_bins:
  - {name: 0-5, lower: 0.0, upper: 6.0}
  - {name: 6-10, lower: 6.0, upper: 11.0}
  - {name: 11-20, lower: 11.0, upper: 21.0}
  - {name: 21-50, lower: 21.0, upper: 51.0}
  - {name: 51+, lower: 51.0, upper: .inf}
target_metrics: [recall_50m_plus, recall_0_5_points]
secondary_metrics: [recall_40_50m, overall_custom_recall, precision, fp_count, matched_localization_error_m, average_matched_confidence, per_class_distance_recall, per_class_density_recall]
official_metrics: [mAP, NDS, mATE, mASE, mAOE, mAVE, mAAE]
bootstrap:
  resampling_unit: scene
  repetitions: 1000
  seed: 42
  confidence_level: 0.95
  paired_comparison: true
tunable_parameters:
  association_threshold_m: [0.5, 1.0, 1.5, 2.0]
  centerpoint_weight: [0.8, 1.0, 1.2]
controlled_variables:
  dataset_version: v1.0-mini
  detector_count: 2
  matching_threshold_m: 2.0
  candidate_floor: 0.1
  architecture_or_weights_change: none
  e1_range_calibration: false
  e2_density_calibration: false
runtime_protocol:
  batch_size: 1
  precision: FP32
  warmup: 5
  iterations: 20
  timing_method: time.perf_counter; fusion-only excludes detector inference
inference_policy:
  ground_truth_at_inference: false
  allowed_features: [centerpoint_boxes, centerpoint_scores, centerpoint_classes, centerpoint_velocity, voxelnext_boxes, voxelnext_scores, voxelnext_classes, voxelnext_velocity, prediction_geometry]
  forbidden_features: [gt_boxes, gt_distance, gt_point_count, gt_class, gt_match_state, gt_localization_error]
tuning:
  fit_split: mini_train
  confirmation_split: mini_val
  selection_rule: maximize 50m+ recall then 0-5-point recall, lower FP, lower threshold, weight closest to 1
  mini_val_used_for_tuning: false
