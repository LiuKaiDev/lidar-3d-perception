backend:
  type: openpcdet
  model: pointpillar
  openpcdet_config: third_party/OpenPCDet/tools/cfgs/kitti_models/pointpillar.yaml
  checkpoint: ~/checkpoints/openpcdet/pointpillar_kitti.pth
  checkpoint_source: https://drive.google.com/file/d/1wMxWTpU1qUoY3DsCH31WJmvJxcjFXKlm/view?usp=sharing
  device: cuda
  score_threshold: 0.1

dataset:
  name: kitti
  root: ~/datasets/kitti
  split: training

benchmark:
  warmup: 20
  iterations: 100
