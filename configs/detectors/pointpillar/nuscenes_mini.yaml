backend:
  type: openpcdet
  model: pointpillar
  openpcdet_config: third_party/OpenPCDet/tools/cfgs/nuscenes_models/cbgs_pp_multihead.yaml
  checkpoint: ~/checkpoints/openpcdet/pointpillar_nuscenes.pth
  checkpoint_source: https://drive.google.com/file/d/1p-501mTWsq0G9RzroTWSXreIMyTUUpBM/view?usp=sharing
  device: cuda
  score_threshold: 0.1

classes:
  - car
  - truck
  - construction_vehicle
  - bus
  - trailer
  - barrier
  - motorcycle
  - bicycle
  - pedestrian
  - traffic_cone

model_metadata:
  display_name: PointPillar-MultiHead
  architecture_family: anchor-based multi-head detector
  representation: 0.2 x 0.2 x 8.0 m pillars with 2D BEV backbone
  ownership: third-party OpenPCDet baseline

dataset:
  name: nuscenes
  root: ~/datasets/nuscenes
  version: v1.0-mini
  split: mini_val
  max_sweeps: 10

evaluation:
  label: nuScenes v1.0-mini / pipeline validation
  split: mini_val

benchmark:
  warmup: 20
  iterations: 100
  batch_size: 1
  precision: FP32
