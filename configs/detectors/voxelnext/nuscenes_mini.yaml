backend:
  type: openpcdet
  model: voxelnext
  openpcdet_config: third_party/OpenPCDet/tools/cfgs/nuscenes_models/cbgs_voxel0075_voxelnext.yaml
  checkpoint: ~/checkpoints/openpcdet/voxelnext_nuscenes.pth
  checkpoint_sha256: 9409dd8c13c8c8ca546c8c5af024856d03029e2def8d5fc0fa3bfe4477e7d88b
  checkpoint_source: https://drive.google.com/file/d/1IV7e7G9X-61KXSjMGtQo579pzDNbhwvf/view?usp=share_link
  device: cuda
  score_threshold: 0.1

classes:
  - car
  - truck
  - construction_vehicle
  - bus
  - trailer
  - barrier
  - motorcycle
  - bicycle
  - pedestrian
  - traffic_cone

model_metadata:
  display_name: VoxelNeXt
  architecture_family: fully sparse center-based detector
  representation: 0.075 x 0.075 x 0.2 m sparse voxels
  ownership: third-party OpenPCDet baseline

dataset:
  name: nuscenes
  root: ~/datasets/nuscenes
  version: v1.0-mini
  split: mini_val
  max_sweeps: 10

evaluation:
  label: nuScenes v1.0-mini / pipeline validation
  split: mini_val

benchmark:
  warmup: 20
  iterations: 100
  batch_size: 1
  precision: FP32
