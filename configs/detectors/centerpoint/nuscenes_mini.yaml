backend:
  type: openpcdet
  model: centerpoint
  openpcdet_config: third_party/OpenPCDet/tools/cfgs/nuscenes_models/cbgs_dyn_pp_centerpoint.yaml
  checkpoint: ~/checkpoints/openpcdet/centerpoint_nuscenes_pp.pth
  checkpoint_source: https://drive.google.com/file/d/1UvGm6mROMyJzeSRu7OD1leU_YWoAZG7v/view?usp=sharing
  device: cuda
  score_threshold: 0.1

dataset:
  name: nuscenes
  root: ~/datasets/nuscenes
  version: v1.0-mini
  split: mini_val
  max_sweeps: 10

evaluation:
  label: nuScenes v1.0-mini / pipeline validation
  split: mini_val
