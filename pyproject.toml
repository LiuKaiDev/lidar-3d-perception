[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-3d-perception"
version = "0.7.0rc1"
description = "LiDAR 3D perception geometry and dataset tools"
license = "Apache-2.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["lidar_perception*"]

[tool.setuptools.data-files]
"share/lidar-3d-perception/configs/analysis" = ["configs/analysis/*.yaml"]
"share/lidar-3d-perception/configs/benchmark" = ["configs/benchmark/*.yaml"]
"share/lidar-3d-perception/configs/datasets" = ["configs/datasets/*.yaml"]
"share/lidar-3d-perception/configs/detectors/centerpoint" = ["configs/detectors/centerpoint/*.yaml"]
"share/lidar-3d-perception/configs/detectors/pointpillar" = ["configs/detectors/pointpillar/*.yaml"]
"share/lidar-3d-perception/configs/detectors/voxelnext" = ["configs/detectors/voxelnext/*.yaml"]
"share/lidar-3d-perception/configs/system" = ["configs/system/*.yaml"]

[project.optional-dependencies]
ci = [
    "pytest==8.3.5",
    "numpy==1.26.4",
    "PyYAML==6.0.2",
]
phase1 = [
    "pytest==8.3.5",
    "matplotlib==3.9.2",
    "open3d==0.19.0",
]
phase2 = [
    "kornia==0.6.12",
    "av2==0.2.1",
    "gdown==6.1.0",
]
phase3 = [
    "nuscenes-devkit==1.2.0",
    "cachetools==7.1.7",
    "descartes==1.1.0",
    "shapely==2.0.6",
    "pycocotools==2.0.11",
    "torch-scatter==2.1.2+pt25cu124",
]
