[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-3d-perception"
version = "0.1.0"
description = "LiDAR 3D perception geometry and dataset tools"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["lidar_perception*"]

[project.optional-dependencies]
phase1 = [
    "pytest==8.3.5",
    "matplotlib==3.9.2",
    "open3d==0.19.0",
]
phase2 = [
    "kornia==0.6.12",
    "av2==0.2.1",
    "gdown==6.1.0",
]
phase3 = [
    "nuscenes-devkit==1.2.0",
    "cachetools==7.1.7",
    "descartes==1.1.0",
    "shapely==2.0.6",
    "pycocotools==2.0.11",
    "torch-scatter==2.1.2+pt25cu124",
]
