name: CPU tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[ci]'
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Validate CPU environment
        run: PYTHONPATH=.:tools python tools/validate_environment.py --profile cpu
      - name: Run focused CPU suite
        run: >-
          PYTHONPATH=.:tools python -m pytest -q
          tests/test_boxes3d.py tests/test_detection_schemas.py tests/test_geometry.py
          tests/test_matching.py tests/test_e3_fusion.py tests/test_phase6_protocol.py
          tests/test_phase7_entrypoints.py tests/test_phase7_docs.py
      - name: Check deterministic report
        run: PYTHONPATH=.:tools python tools/generate_phase6_summary.py --check
